[project]
name = "agent-context-platform"
version = "0.1.0"
description = "Engineering context retrieval system for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "fastapi>=0.121.0",
    "httpx>=0.28.0",
    "jieba>=0.42.1",
    "markdown-it-py>=4.0.0",
    "mcp[cli]>=1.0.0",
    "pgvector>=0.4.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "sqlglot>=28.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-java>=0.23.0",
    "uvicorn>=0.46.0",
]

[project.scripts]
acp-index = "agent_context_platform.index_cli:main"
acp-mcp-server = "agent_context_platform.mcp_server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
